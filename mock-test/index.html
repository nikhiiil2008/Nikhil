function choose(k){if(answered)return;answered=true;const x=list[i];[...$("opts").children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add("correct");else if(j===k)b.classList.add("wrong")});if(k===x.a)score++;$("score").textContent="स्कोर: "+score;$("feedback").textContent=(k===x.a?"✅ सही! ":"❌ सही उत्तर: "+x.o[x.a]+". ")+x.e;$("next").classList.remove("hide");$("next").textContent=i===list.length-1?"परिणाम देखें":"अगला प्रश्न →"}
