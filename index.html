
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Colorful Calculator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;min-height:100vh;
 display:flex;justify-content:center;align-items:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);
}
.app{
 width:100%;max-width:390px;background:#fff;
 padding:20px;border-radius:25px;
 box-shadow:0 15px 45px #25134b55;
}
h2{text-align:center;color:#6639bb;margin:0 0 15px}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{
 flex:1;padding:12px;border:0;border-radius:12px;
 color:white;font-weight:bold;background:#999;
 cursor:pointer
}
.tabs button.active{background:linear-gradient(90deg,#4776e6,#8e54e9)}
.display{
 background:#172554;color:white;padding:18px;
 border-radius:15px;text-align:right;margin-bottom:15px;
 min-height:95px;overflow:hidden;
}
#expression{font-size:16px;color:#a5b4fc;min-height:22px;word-break:break-all}
#result{font-size:30px;font-weight:bold;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button.key{
 border:0;border-radius:13px;padding:16px 4px;
 font-size:18px;font-weight:bold;background:#eef0ff;
 color:#25234b;cursor:pointer;
 box-shadow:0 3px 5px #00000012;
}
button.key:active{transform:scale(.95)}
.key.op{background:#e9d5ff;color:#7028c8}
.key.fn{background:#dbeafe;color:#2458a8}
.key.clear{background:#fecaca;color:#b91c1c}
.key.equal{background:linear-gradient(135deg,#16a34a,#059669);color:white}
.science{display:none;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}
.science button{font-size:14px;padding:12px 2px}
.history{
 margin-top:16px;background:#f5f3ff;padding:12px;
 border-radius:12px;font-size:13px;color:#444;
}
.history h3{margin:0 0 8px;color:#6639bb}
.history p{margin:5px 0;word-break:break-all}
.history button{float:right;border:0;background:none;color:#dc2626;cursor:pointer}
.footer{text-align:center;color:#888;font-size:11px;margin-top:15px}
@media(max-width:360px){
 .app{padding:14px}
 button.key{padding:13px 2px}
}
</style>
</head>
<body>
<div class="app">
<h2>🌈 MY CALCULATOR</h2>

<div class="tabs">
<button id="simpleTab" class="active" onclick="setMode('simple')">Simple</button>
<button id="scienceTab" onclick="setMode('science')">Scientific</button>
</div>

<div class="display">
 <div id="expression">Ready</div>
 <div id="result">0</div>
</div>

<div class="science" id="scienceKeys">
 <button class="key fn" onclick="add('sin(')">sin</button>
 <button class="key fn" onclick="add('cos(')">cos</button>
 <button class="key fn" onclick="add('tan(')">tan</button>
 <button class="key fn" onclick="add('log(')">log</button>
 <button class="key fn" onclick="add('ln(')">ln</button>
 <button class="key fn" onclick="add('sqrt(')">√</button>
 <button class="key fn" onclick="add('^2')">x²</button>
 <button class="key fn" onclick="add('^')">xʸ</button>
 <button class="key fn" onclick="add('π')">π</button>
 <button class="key fn" onclick="add('e')">e</button>
 <button class="key fn" onclick="add('(')">(</button>
 <button class="key fn" onclick="add(')')">)</button>
 <button class="key fn" onclick="add('!')">x!</button>
 <button class="key fn" onclick="add('abs(')">|x|</button>
 <button class="key fn" onclick="add('1/(')">1/x</button>
 <button class="key fn" onclick="add('^3')">x³</button>
</div>

<div class="keys">
 <button class="key clear" onclick="clearAll()">AC</button>
 <button class="key clear" onclick="backspace()">⌫</button>
 <button class="key op" onclick="add('%')">%</button>
 <button class="key op" onclick="add('/')">÷</button>

 <button class="key" onclick="add('7')">7</button>
 <button class="key" onclick="add('8')">8</button>
 <button class="key" onclick="add('9')">9</button>
 <button class="key op" onclick="add('*')">×</button>

 <button class="key" onclick="add('4')">4</button>
 <button class="key" onclick="add('5')">5</button>
 <button class="key" onclick="add('6')">6</button>
 <button class="key op" onclick="add('-')">−</button>

 <button class="key" onclick="add('1')">1</button>
 <button class="key" onclick="add('2')">2</button>
 <button class="key" onclick="add('3')">3</button>
 <button class="key op" onclick="add('+')">+</button>

 <button class="key" onclick="add('±')">±</button>
 <button class="key" onclick="add('0')">0</button>
 <button class="key" onclick="add('.')">.</button>
 <button class="key equal" onclick="calculate()">=</button>
</div>

<div class="history">
 <h3>📜 Calculation History <button onclick="clearHistory()">Clear</button></h3>
 <div id="historyList">No calculations yet</div>
</div>
<div class="footer">Made with ❤️ | My Calculator</div>
</div>

<script>
let expression = '';
let justCalculated = false;
let historyItems = [];
let mode = 'simple';
let degrees = true;

const resultEl = document.getElementById('result');
const expressionEl = document.getElementById('expression');

function setMode(m){
 mode=m;
 document.getElementById('scienceKeys').style.display =
   m==='science'?'grid':'none';
 document.getElementById('simpleTab').classList.toggle('active',m==='simple');
 document.getElementById('scienceTab').classList.toggle('active',m==='science');
}

function add(value){
 if(justCalculated && /[0-9.(πe]/.test(value)){
   expression='';
 }
 justCalculated=false;
 if(value==='±'){
   expression = expression.startsWith('-') ?
    expression.slice(1) : '-'+expression;
 }else{
   expression+=value;
 }
 expressionEl.textContent=expression;
 resultEl.textContent=expression || '0';
}

function clearAll(){
 expression='';
 justCalculated=false;
 expressionEl.textContent='Ready';
 resultEl.textContent='0';
}

function backspace(){
 expression=expression.slice(0,-1);
 justCalculated=false;
 expressionEl.textContent=expression || 'Ready';
 resultEl.textContent=expression || '0';
}

function factorial(n){
 if(n<0 || !Number.isInteger(n) || n>170)
   throw Error('Invalid factorial');
 let v=1;
 for(let i=2;i<=n;i++)v*=i;
 return v;
}

function calculate(){
 if(!expression)return;
 try{
   let exp=expression
    .replace(/π/g,'Math.PI')
    .replace(/\be\b/g,'Math.E')
    .replace(/sqrt\(/g,'Math.sqrt(')
    .replace(/abs\(/g,'Math.abs(')
    .replace(/sin\(/g,'Math.sin(')
    .replace(/cos\(/g,'Math.cos(')
    .replace(/tan\(/g,'Math.tan(')
    .replace(/log\(/g,'Math.log10(')
    .replace(/ln\(/g,'Math.log(');

   if(degrees){
     exp=exp
      .replace(/Math\.sin\(/g,'Math.sin((Math.PI/180)*')
      .replace(/Math\.cos\(/g,'Math.cos((Math.PI/180)*')
      .replace(/Math\.tan\(/g,'Math.tan((Math.PI/180)*');
   }

   exp=exp.replace(/\^/g,'**');
   exp=exp.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');

   // Factorial
   exp=exp.replace(/(\d+(?:\.\d+)?)!/g,'factorial($1)');

   if(!/^[0-9+\-*/().,%\sA-Za-z_*]+$/.test(exp))
     throw Error('Invalid expression');

   if(/(?:Math\.(?!PI|E|sqrt|abs|sin|cos|tan|log10|log)|constructor|window|document|alert|eval)/i.test(exp))
     throw Error('Invalid expression');

   const answer=Function('factorial',
      '"use strict"; return ('+exp+')')(factorial);

   if(!Number.isFinite(answer))throw Error('Math error');

   const formatted=Number(answer.toPrecision(12)).toString();
   expressionEl.textContent=expression+' =';
   resultEl.textContent=formatted;

   historyItems.unshift(expression+' = '+formatted);
   historyItems=historyItems.slice(0,10);
   renderHistory();

   expression=formatted;
   justCalculated=true;
 }catch(e){
   resultEl.textContent='Error';
 }
}

function renderHistory(){
 document.getElementById('historyList').innerHTML=
 historyItems.length
 ?historyItems.map(x=>'<p>'+escapeHTML(x)+'</p>').join('')
 : 'No calculations yet';
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 }[c]));
}

function clearHistory(){
 historyItems=[];
 renderHistory();
}

document.addEventListener('keydown',e=>{
 if(/[0-9.()+\-*/%]/.test(e.key) && e.key.length===1){
   add(e.key);
 }else if(e.key==='Enter'){
   e.preventDefault();calculate();
 }else if(e.key==='Backspace'){
   backspace();
 }else if(e.key==='Escape'){
   clearAll();
 }
});
</script>
</body>
</html>
